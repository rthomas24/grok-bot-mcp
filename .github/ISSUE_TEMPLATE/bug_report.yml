name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please run `npx -y github:rthomas24/grok-bot-mcp doctor` first and include its output below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you ask your agent to do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `npx -y github:rthomas24/grok-bot-mcp doctor`. Remove anything private, like agent names.
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Tool error or response
      description: The error or JSON your agent got back from the tool, if any.
      render: text
  - type: input
    id: grok
    attributes:
      label: Grok Bot app version
      placeholder: "0.70.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Codex
        - Cursor
        - VS Code
        - Claude Desktop
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Claude Code plugin
        - claude mcp add / codex mcp add (npx)
        - JSON config (npx)
        - Local clone
    validations:
      required: true
