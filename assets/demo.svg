<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot MCP demo</title>
  <desc id="desc">Illustration: in Claude Code, the user asks their Researcher bot for sources. Claude reads the Researcher chat and sends the message through the grok-bot MCP server, and the message and the bot's reply appear live in the Grok Bot desktop app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C16"/>
      <stop offset="1" stop-color="#141833"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="winL"><rect x="36" y="120" width="520" height="484" rx="12"/></clipPath>
    <clipPath id="winR"><rect x="644" y="120" width="520" height="484" rx="12"/></clipPath>
    <clipPath id="type1"><rect x="54" y="248" width="0" height="20">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.10;0.97;1" values="0;0;480;480;0"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="54" y="266" width="0" height="20">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.10;0.15;0.97;1" values="0;0;480;480;0"/>
    </rect></clipPath>
    <!-- Grok Bot avatar: a soft blob with two eyes -->
    <symbol id="blob" viewBox="0 0 24 24">
      <path d="M12 1.5c6.4 0 10.5 4.1 10.5 10.2 0 6.3-4.6 10.8-10.6 10.8C5.6 22.5 1.5 18 1.5 11.8 1.5 5.8 5.7 1.5 12 1.5z"/>
      <rect x="9" y="7.5" width="2.2" height="5" rx="1.1" fill="#161616" transform="rotate(-12 10 10)"/>
      <rect x="14" y="7" width="2.2" height="5" rx="1.1" fill="#161616" transform="rotate(-12 15 9.5)"/>
    </symbol>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <circle cx="600" cy="360" r="330" fill="url(#glow)"/>

  <!-- Header -->
  <text x="40" y="66" class="sans" font-size="30" font-weight="700" fill="#F5F5FA">Grok Bot MCP</text>
  <text x="40" y="96" class="sans" font-size="17" fill="#A3A6C4">Claude Code, Codex &amp; Cursor drive your Grok Bots, live on your Mac</text>
  <g transform="translate(1012 58)">
    <rect width="152" height="28" rx="14" fill="#1A1F3A" stroke="#2E3459"/>
    <circle cx="18" cy="14" r="5" fill="#34D399">
      <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0.25;1"/>
    </circle>
    <text x="32" y="19" class="sans" font-size="13" font-weight="600" fill="#C9CBE0" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <!-- Left: Claude Code in a terminal -->
  <g clip-path="url(#winL)">
    <rect x="36" y="120" width="520" height="484" fill="#141414"/>
    <rect x="36" y="120" width="520" height="30" fill="#232323"/>
    <circle cx="56" cy="135" r="5.5" fill="#FF5F57"/>
    <circle cx="74" cy="135" r="5.5" fill="#FEBC2E"/>
    <circle cx="92" cy="135" r="5.5" fill="#28C840"/>
    <text x="296" y="139" text-anchor="middle" class="sans" font-size="12" fill="#9A9A9A">my-app — claude</text>

    <g class="mono" font-size="13">
      <rect x="52" y="166" width="488" height="68" rx="6" fill="none" stroke="#D77757"/>
      <text x="66" y="188" fill="#FFFFFF"><tspan fill="#D77757">✻</tspan> Welcome to <tspan font-weight="700">Claude Code</tspan>!</text>
      <text x="84" y="208" fill="#8B8B8B">/help for help, /status for your current setup</text>
      <text x="84" y="226" fill="#8B8B8B">cwd: /Users/you/my-app</text>

      <g clip-path="url(#type1)"><text x="54" y="262" fill="#A8A8A8">&gt; Ask my Researcher bot for 3 recent sources on</text></g>
      <g clip-path="url(#type2)"><text x="70" y="280" fill="#A8A8A8">solid-state batteries, then summarize.</text></g>

      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.19;0.2;0.97;1" values="0;0;1;1;0"/>
        <text x="54" y="314" fill="#FFFFFF"><tspan fill="#4EBA65">●</tspan> <tspan font-weight="700">grok-bot - read_messages</tspan> (MCP)<tspan fill="#8B8B8B">(agent: "Researcher")</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.23;0.24;0.97;1" values="0;0;1;1;0"/>
        <text x="70" y="332" fill="#8B8B8B">⎿  Read 6 messages</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.27;0.28;0.97;1" values="0;0;1;1;0"/>
        <text x="54" y="364" fill="#FFFFFF"><tspan fill="#4EBA65">●</tspan> <tspan font-weight="700">grok-bot - send_message</tspan> (MCP)<tspan fill="#8B8B8B">(agent: "Researcher",</tspan></text>
        <text x="70" y="382" fill="#8B8B8B">message: "Find 3 recent sources on solid-st…")</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.59;0.6;0.97;1" values="0;0;1;1;0"/>
        <text x="70" y="400" fill="#8B8B8B">⎿  Researcher replied in 14s</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.64;0.65;0.97;1" values="0;0;1;1;0"/>
        <text x="54" y="434" fill="#FFFFFF">● Your Researcher bot found 3 sources, newest first:</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.68;0.69;0.97;1" values="0;0;1;1;0"/>
        <text x="70" y="454" fill="#D4D4D4">1. A 2026 review of sulfide electrolytes</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.71;0.72;0.97;1" values="0;0;1;1;0"/>
        <text x="70" y="472" fill="#D4D4D4">2. A study on stopping lithium dendrites</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.74;0.75;0.97;1" values="0;0;1;1;0"/>
        <text x="70" y="490" fill="#D4D4D4">3. A cost analysis of pilot production lines</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.32;0.33;0.58;0.59;1" values="0;0;1;1;0;0"/>
        <text x="54" y="512" fill="#D77757">✻ <tspan>Waiting for Researcher…<animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="1;0.45;1"/></tspan> <tspan fill="#8B8B8B">(14s · esc to interrupt)</tspan></text>
      </g>

      <rect x="52" y="524" width="488" height="34" rx="6" fill="none" stroke="#5A5A5A"/>
      <text x="64" y="546" fill="#FFFFFF">&gt;</text>
      <rect x="80" y="534" width="8" height="15" fill="#E5E5E5">
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/>
      </rect>
      <text x="64" y="578" fill="#7A7A7A">? for shortcuts</text>
    </g>
  </g>
  <rect x="36" y="120" width="520" height="484" rx="12" fill="none" stroke="#333333"/>

  <!-- Middle: the MCP connection -->
  <g>
    <line x1="560" y1="362" x2="640" y2="362" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" dur="0.8s" repeatCount="indefinite" values="12;0"/>
    </line>
    <rect x="570" y="347" width="60" height="30" rx="15" fill="#1A1F3A" stroke="#7C5CFF"/>
    <text x="600" y="367" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#D9D2FF" letter-spacing="0.5">MCP</text>
  </g>

  <!-- Right: the Grok Bot desktop app -->
  <g clip-path="url(#winR)" class="sans">
    <rect x="644" y="120" width="520" height="484" fill="#121212"/>

    <!-- Sidebar -->
    <rect x="644" y="120" width="152" height="484" fill="#0E0E0E"/>
    <line x1="796" y1="120" x2="796" y2="604" stroke="#1C1C1C"/>
    <circle cx="660" cy="137" r="5" fill="#3A3A3A"/>
    <circle cx="676" cy="137" r="5" fill="#3A3A3A"/>
    <circle cx="692" cy="137" r="5" fill="#3A3A3A"/>
    <rect x="717" y="131" width="13" height="11" rx="2.5" fill="none" stroke="#9A9A9A" stroke-width="1.3"/>
    <line x1="721.5" y1="131" x2="721.5" y2="142" stroke="#9A9A9A" stroke-width="1.3"/>
    <circle cx="751" cy="137" r="11" fill="none" stroke="#2A2A2A"/>
    <circle cx="750" cy="136" r="3.6" fill="none" stroke="#C8C8C8" stroke-width="1.3"/>
    <line x1="752.6" y1="138.6" x2="755" y2="141" stroke="#C8C8C8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="777" cy="137" r="11" fill="none" stroke="#2A2A2A"/>
    <path d="M777 132v10M772 137h10" stroke="#C8C8C8" stroke-width="1.3" stroke-linecap="round"/>

    <use href="#blob" x="656" y="162" width="26" height="26" fill="#F2F2F2"/>
    <text x="690" y="173" font-size="12.5" fill="#F2F2F2">Grok Bot</text>
    <text x="690" y="189" font-size="11" fill="#9D9D9D">ok</text>

    <rect x="651" y="200" width="138" height="42" rx="8" fill="#202020"/>
    <use href="#blob" x="656" y="208" width="26" height="26" fill="#E87031"/>
    <text x="690" y="219" font-size="12.5" fill="#F2F2F2">Researcher</text>
    <text x="690" y="235" font-size="11" fill="#9D9D9D">Ready for the next…
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.57;0.58;0.97;1" values="1;1;0;0;1"/>
    </text>
    <text x="690" y="235" font-size="11" fill="#9D9D9D" opacity="0">Found 3 sources
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.57;0.58;0.97;1" values="0;0;1;1;0"/>
    </text>

    <use href="#blob" x="656" y="252" width="26" height="26" fill="#55B5A4"/>
    <text x="690" y="263" font-size="12.5" fill="#F2F2F2">Coder</text>
    <text x="690" y="279" font-size="11" fill="#9D9D9D">Pushed the fix</text>

    <use href="#blob" x="656" y="296" width="26" height="26" fill="#3E82F4"/>
    <text x="690" y="307" font-size="12.5" fill="#F2F2F2">Marketer</text>
    <text x="690" y="323" font-size="11" fill="#9D9D9D">Draft is ready</text>

    <circle cx="668" cy="578" r="13" fill="none" stroke="#2A2A2A"/>
    <text x="668" y="582" text-anchor="middle" font-size="10.5" fill="#C8C8C8">YO</text>
    <rect x="688" y="565" width="98" height="26" rx="13" fill="none" stroke="#2A2A2A"/>
    <text x="737" y="582" text-anchor="middle" font-size="11.5" fill="#E6E6E6">Connect apps</text>

    <!-- Chat -->
    <rect x="924" y="130" width="112" height="28" rx="14" fill="#1A1A1A"/>
    <use href="#blob" x="932" y="135" width="18" height="18" fill="#E87031"/>
    <text x="956" y="149" font-size="12.5" fill="#F2F2F2">Researcher</text>

    <rect x="808" y="178" width="164" height="30" rx="15" fill="#232323"/>
    <text x="820" y="197" font-size="13" fill="#E6E6E6">Ready for the next task.</text>

    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.32;0.97;1" values="0;0;1;1;0"/>
      <rect x="966" y="222" width="186" height="48" rx="18" fill="#383838"/>
      <text x="980" y="242" font-size="13" fill="#F2F2F2">Find 3 recent sources on</text>
      <text x="980" y="260" font-size="13" fill="#F2F2F2">solid-state batteries</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.40;0.41;0.97;1" values="0;0;1;1;0"/>
      <rect x="808" y="284" width="178" height="30" rx="15" fill="#232323"/>
      <text x="820" y="303" font-size="13" fill="#E6E6E6">Checking a few sources now.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.57;0.58;0.97;1" values="0;0;1;1;0"/>
      <rect x="808" y="322" width="232" height="92" rx="16" fill="#232323"/>
      <text x="820" y="343" font-size="13" fill="#E6E6E6">Here are 3 sources, newest first:</text>
      <text x="820" y="362" font-size="13" fill="#E6E6E6">1. Sulfide electrolyte review</text>
      <text x="820" y="381" font-size="13" fill="#E6E6E6">2. Dendrite suppression study</text>
      <text x="820" y="400" font-size="13" fill="#E6E6E6">3. Pilot-line cost analysis</text>
    </g>

    <!-- Composer -->
    <rect x="808" y="552" width="344" height="40" rx="20" fill="#1F1F1F" stroke="#2C2C2C"/>
    <circle cx="828" cy="572" r="11" fill="none" stroke="#3A3A3A"/>
    <path d="M828 567v10M823 572h10" stroke="#C8C8C8" stroke-width="1.3" stroke-linecap="round"/>
    <text x="848" y="576" font-size="13" fill="#8A8A8A">Message Researcher
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.28;0.285;0.31;0.315;1" values="1;1;0;0;1;1"/>
    </text>
    <text x="848" y="576" font-size="13" fill="#F2F2F2" opacity="0">Find 3 recent sources on solid…
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.28;0.285;0.31;0.315;1" values="0;0;1;1;0;0"/>
    </text>
    <rect x="1099" y="564" width="7" height="11" rx="3.5" fill="none" stroke="#C8C8C8" stroke-width="1.3"/>
    <path d="M1097 572a5.5 5.5 0 0 0 11 0M1102.5 577.5v3" fill="none" stroke="#C8C8C8" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="1132" cy="572" r="13" fill="#F2F2F2"/>
    <path d="M1126 570v4M1129 567v10M1132 565v14M1135 568v8M1138 570v4" stroke="#141414" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <rect x="644" y="120" width="520" height="484" rx="12" fill="none" stroke="#2A2A2A"/>
</svg>
